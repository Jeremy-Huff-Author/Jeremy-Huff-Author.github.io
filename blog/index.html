    <main>
        <div class="container py-4">
            <div class="row mt-5">
                <div class="col-md-1">
                    <button class="btn btn-dark mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvas" aria-controls="offcanvas">
                        POSTS
                    </button>
                    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvas" aria-labelledby="offcanvasLabel">
                        <div class="offcanvas-header">
                            <h5 class="offcanvas-title" id="offcanvasLabel">ALL POSTS</h5>
                            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body">
                            <div class="mb-3">
                                <input id="posts-filter" type="text" class="form-control posts-filter-input" placeholder="Filter posts by title..." autocomplete="off" aria-label="Filter posts by title">
                            </div>
                            <ul id="posts-list" class="list-group list-group-flush">
                                <!-- Blog post list will be loaded here -->
                            </ul>
                        </div>
                    </div>    
                </div>
                <div class="col-md-11" id="post-content">
                    <!-- Blog posts will be loaded here by blog-renderer.js -->
                </div>
            </div>
            <div class="row mt-5">
                <div class="col-md-1"></div>
                <div class="col-md-11 d-none" id="comment-form-launcher">
                    <hr>
                    <!-- Comment Section -->
                    <button class="btn btn-dark float-end" type="button" data-bs-toggle="modal" data-bs-target="#comment-modal">
                        Leave a Comment
                    </button>
                    <h3>Comments</h3>
                    <form id="comment-form">
                        <div class="modal fade" id="comment-modal" tabindex="-1" aria-labelledby="comment-modal-label" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="comment-modal-label">Leave a Comment</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="row mb-3">
                                            <div class="col-md-6">
                                                <label for="commenter_name" class="form-label">Name</label>
                                                <input type="text" class="form-control" name="commenter_name" required>
                                            </div>
                                            <div class="col-md-6">
                                                <label for="commenter_email" class="form-label">Email</label>
                                                <input type="email" class="form-control" name="commenter_email" required>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="comment_text" class="form-label">Comment</label>
                                            <textarea class="form-control" name="comment_text" rows="4" required></textarea>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                        <button type="submit" class="btn btn-dark">Submit Comment</button>
                                    </div>
                                </div>
                            </div>
                        </div>                       
                    </form>
                </div>
            </div>
            <div class="row mt-5">
                <div class="col-md-1"></div>
                <div class="col-md-11">
                    <div id="comments-section">
                    </div>
                </div>
            </div>
        </div>
