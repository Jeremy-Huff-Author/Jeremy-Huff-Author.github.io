name: Build Gallery

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Or your desired Node.js version

      - name: Install dependencies
        run: npm install

      - name: Run Gallery Build Script
        env:
          NOTION_TOKEN: ${{secrets.NOTION_TOKEN}}
          NOTION_LOCATION_DB_ID: ${{secrets.NOTION_LOCATION_DB_ID}}
        run: node build/build-gallery.js

      - name: Commit and Push Changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Jeremy Huff"
          git config user.email "jeremythuff@gmail.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
          git add gallery/*
          git diff --cached --quiet || git commit -m "Update Gallery"
          git log -1
          git push origin HEAD
